# 插件目录
# 启用的群列表，所有插件的全局配置
groups: []
# 各插件配置(下面以core插件示范)
plugins:
  # core插件的配置
  core:
    # 下面说的所有"加载"指的是插件的初始化
    # 插件加载顺序,通过seq的值从小到大依次加载
    # seq相同时，加载顺序不能保证
    seq: 0
    # 是否排除插件(不会加载)
    exclude: false
    # 是否禁用插件(只是禁用功能，但还是会加载)
    disable: false
    # 启用的群列表(为这个插件单独指定启用的群，会屏蔽群设置)
    groups: []
    # conf是对应插件的配置字段，取决于各插件的实现
    conf:
      help_top: 下面是我的所有本领！
      help_tail: 更多本领绝赞学习中,加入github.com/KohmeBot来教会我吧！
    # ... 若有其他键值对，将会作为插件的环境变量传入




